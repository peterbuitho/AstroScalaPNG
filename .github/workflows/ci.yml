# Fast feedback: compile and test on every push and pull request.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - uses: dtolnay/rust-toolchain@stable

      - name: Build astropng-core
        shell: bash
        run: bash scripts/build-core.sh

      - name: Compile
        run: sbt -batch compile

      - name: Test
        run: sbt -batch test
