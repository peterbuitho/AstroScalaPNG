# Builds AstroScalaPNG for Windows, macOS and Linux and attaches the archives
# to a GitHub Release.
#
# Triggered by pushing a tag like `v0.5.0`. Can also be run manually from the
# Actions tab ("Run workflow") to check that all targets still build; in that
# case the archives are available as workflow artifacts but no release is made.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - uses: dtolnay/rust-toolchain@stable

      - name: Build astropng-core
        shell: bash
        run: bash scripts/build-core.sh

      - name: Test
        run: sbt -batch test

      # cli: JavaAppPackaging + JlinkPlugin, so the archive carries its own
      # stripped-down Java runtime (folder `jre`) and needs no JDK installed.
      # gui: JavaAppPackaging with the JavaFX jars for this platform; it runs
      # on any installed Java 25+.
      - name: Build app images
        run: sbt -batch "cli/stage" "gui/stage"

      # Both apps link astropng-core at runtime via java.lang.foreign; drop
      # the shared library built above into each staged app's lib/ folder,
      # next to the jars, where Native.scala's jar-relative lookup finds it.
      - name: Bundle astropng-core into staged apps
        shell: bash
        run: |
          set -euo pipefail
          lib=$(ls third_party/astropng-core/lib/)
          cp "third_party/astropng-core/lib/$lib" cli/target/universal/stage/lib/
          cp "third_party/astropng-core/lib/$lib" gui/target/universal/stage/lib/

      - name: Assemble (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          arch=$(echo "${{ runner.arch }}" | tr '[:upper:]' '[:lower:]')
          asset="astroscalapng-${{ matrix.name }}-${arch}.zip"
          rm -rf dist && mkdir -p dist
          cp -R cli/target/universal/stage dist/cli
          cp -R gui/target/universal/stage dist/gui
          cp README.md dist/
          (cd dist && zip -q -r "../$asset" .)
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Assemble (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $arch = "${{ runner.arch }}".ToLower()
          $asset = "astroscalapng-${{ matrix.name }}-$arch.zip"
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item -Recurse cli/target/universal/stage dist/cli
          Copy-Item -Recurse gui/target/universal/stage dist/gui
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath $asset
          "ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x /tmp/appimagetool

          # Unlike the native GUIs (Go/Zig), there's no shared-library
          # discovery to do here: JavaFX's natives are bundled inside its
          # classpath jars already, and `java` itself only needs glibc. The
          # AppImage instead bundles a full JDK (reusing the one
          # actions/setup-java already installed) so it needs no system Java
          # at all -- sidestepping the JDK-version requirement entirely.
          appdir="$(mktemp -d)/AppDir"
          mkdir -p "$appdir/usr/lib/app"
          cp -R "$JAVA_HOME" "$appdir/usr/lib/jvm"
          cp gui/target/universal/stage/lib/*.jar "$appdir/usr/lib/app/"
          cp third_party/astropng-core/lib/* "$appdir/usr/lib/app/"
          cp assets/icon-256.png "$appdir/astroscalapng.png"
          cat > "$appdir/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export ASTROPNG_CORE_LIB="$HERE/usr/lib/app/libastropng_core.so"
          exec "$HERE/usr/lib/jvm/bin/java" --enable-native-access=ALL-UNNAMED \
            -cp "$HERE/usr/lib/app/*" astroscalapng.gui.Launcher "$@"
          EOF
          chmod +x "$appdir/AppRun"
          cat > "$appdir/astroscalapng-gui.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=AstroScalaPNG
          Exec=astroscalapng-gui
          Icon=astroscalapng
          Categories=Graphics;
          EOF

          # No FUSE on GitHub-hosted runners; appimagetool extracts and runs
          # itself instead of mounting. Built at the repo root, not under
          # dist/ -- the release job's download-artifact preserves each
          # artifact's internal paths under its own "dist" target folder, so
          # a file already named dist/... here would land at dist/dist/...
          # and be silently missed by that job's non-recursive dist/* glob.
          /tmp/appimagetool --appimage-extract-and-run "$appdir" astroscalapng-gui-linux.AppImage

      - name: Smoke test (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: ./cli/target/universal/stage/bin/astroscalapng --version

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: cli\target\universal\stage\bin\astroscalapng.bat --version

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ env.ASSET }}
            *.AppImage
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
